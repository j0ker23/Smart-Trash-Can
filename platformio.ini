[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep
lib_deps = 
    adafruit/Adafruit Neopixel   
    https://github.com/pololu/vl53l0x-arduino/archive/refs/tags/1.3.1.zip 
    madhephaestus/ESP32Servo

